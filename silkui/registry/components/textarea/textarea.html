{% comment %}NexUI Textarea v1.0.0{% endcomment %}
<div class="flex flex-col gap-1.5 {{ container_class }}">
  {% if label %}
  <label
    {% if id %}for="{{ id }}"{% elif name %}for="{{ name }}"{% endif %}
    class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 {{ label_class }}"
  >{{ label }}{% if required %}<span class="text-destructive ml-1">*</span>{% endif %}</label>
  {% endif %}

  <textarea
    name="{{ name }}"
    id="{{ id|default:name }}"
    {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
    {% if rows %}rows="{{ rows }}"{% endif %}
    {% if required %}required{% endif %}
    {% if disabled %}disabled{% endif %}
    {% if readonly %}readonly{% endif %}
    class="flex min-h-[80px] w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 {{ input_class }}"
    {{ attrs }}
  >{{ value }}</textarea>

  {% if hint %}
  <p class="text-xs text-muted-foreground">{{ hint }}</p>
  {% endif %}

  {% if error %}
  <p class="text-xs text-destructive">{{ error }}</p>
  {% endif %}
</div>
