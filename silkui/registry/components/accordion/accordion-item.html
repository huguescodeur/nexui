<div x-data="{ open: {% if open %}true{% else %}false{% endif %} }" class="{{ class }}">
  <button type="button" @click="open = !open"
          class="flex w-full items-center justify-between px-4 py-4 text-sm font-medium text-left transition-all hover:bg-muted/50"
          :aria-expanded="open">
    <span>{{ title }}</span>
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         :class="open ? 'rotate-180' : ''" class="shrink-0 transition-transform duration-200">
      <path d="m6 9 6 6 6-6"/>
    </svg>
  </button>
  <div x-show="open"
       x-transition:enter="transition ease-out duration-150"
       x-transition:enter-start="opacity-0 -translate-y-1"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-100"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       class="px-4 pb-4 text-sm text-muted-foreground">
    {{ slot }}
  </div>
</div>
